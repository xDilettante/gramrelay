[package]
name = "tg-agent"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
description = "Durable and authorized Telegram actions for agents"

[features]
executor = ["tokio/time"]
bot = ["tg/bot", "tokio/macros", "tokio/time"]
webhook = ["bot", "tg/webhook", "tokio/net"]
tracing = ["tg/tracing"]
metrics = ["tg/metrics"]

[dependencies]
base64 = "0.23"
getrandom = "0.4"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
tg = { path = "..", default-features = false }
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tg = { path = "..", default-features = false, features = ["test-kit"] }

[lints.rust]
unsafe_code = "forbid"

[[example]]
name = "durable_bot"
required-features = ["bot"]

[[example]]
name = "durable_webhook"
required-features = ["webhook"]

[[example]]
name = "authorized_send"
required-features = ["executor"]
