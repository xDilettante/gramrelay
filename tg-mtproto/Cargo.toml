[package]
name = "tg-mtproto"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.89"
license-file = "../LICENSE"
publish = false
description = "Explicit Telegram MTProto sessions and client for humans and agents"

[features]
test-kit = ["grammers-mtsender/tg-test-kit"]

[dependencies]
bytes = "1.12"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
grammers-session = { path = "../vendor/grammers-session", default-features = false, features = ["serde"] }
grammers-mtsender = { path = "../vendor/grammers-mtsender", default-features = false }
grammers-mtproto = { path = "../vendor/grammers-mtproto", default-features = false }
grammers-tl-types = { path = "../vendor/grammers-tl-types" }
grammers-crypto = { version = "=0.12.0" }
num-bigint = "0.4"
sha2 = { version = "0.11", features = ["zeroize"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1.14"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zeroize = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tempfile = "3"
md-5 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
grammers-mtsender = { path = "../vendor/grammers-mtsender", default-features = false, features = ["tg-test-kit"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }

[[example]]
name = "offline_ping"
required-features = ["test-kit"]

[lints.rust]
unsafe_code = "forbid"
