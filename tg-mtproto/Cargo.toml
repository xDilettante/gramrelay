[package]
name = "tg-mtproto"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
description = "Explicit Telegram MTProto sessions and client for humans and agents"

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
grammers-session = { version = "=0.12.0", default-features = false, features = ["serde"] }
grammers-mtsender = { version = "=0.12.0", default-features = false }
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1.14"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
grammers-mtsender = { version = "=0.12.0", default-features = false, features = ["tg-test-kit"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
