[package]
name = "tg"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false
description = "A predictable Telegram Bot API client for humans and agents"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"
