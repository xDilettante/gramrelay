name: Compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        rust: ['1.89.0', stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      CARGO_INCREMENTAL: '0'
      RUST_TEST_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Check build storage budget
        run: python -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Install Rust without changing the default
        id: rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy --no-self-update
      - name: Tool regressions
        run: python -m unittest discover -s tools/tests -v
      - name: Protocol schema
        run: python tools/schema.py check
      - name: Grammers provenance
        run: python tools/verify_grammers.py check
      - name: MCP provenance
        run: python tools/verify_rmcp.py check
      - name: Native runtime and isolated features
        run: python tools/check_compat.py --toolchain ${{ matrix.rust }}
      - name: Formatting on stable
        if: matrix.rust == 'stable'
        run: cargo +stable fmt --all -- --check
      - name: Clippy on stable
        if: matrix.rust == 'stable'
        run: cargo +stable clippy --locked --workspace --all-features --all-targets --target-dir target/compat-stable -- -D warnings
      - name: Check storage after native quality
        if: always() && steps.rust.outcome == 'success'
        run: python -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Clean completed native build
        if: always() && steps.rust.outcome == 'success'
        run: cargo +${{ matrix.rust }} clean --target-dir target/compat-${{ matrix.rust }} --profile dev
      - name: Check storage before relocated acceptance
        run: python -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Reproducible trusted source candidate and relocated consumer
        run: >-
          python -c "import subprocess,sys; from tools.source_bundle import ROOT,build;
          p,m=build(ROOT,ROOT/'target/dist'); build(ROOT,ROOT/'target/dist');
          subprocess.run([sys.executable,'tools/source_bundle.py','check',str(p),'--manifest',str(m),'--consumer'],check=True)"
      - name: Check storage after relocated acceptance
        if: always() && steps.rust.outcome == 'success'
        run: python -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Clean completed relocated build
        if: always() && steps.rust.outcome == 'success'
        run: cargo +${{ matrix.rust }} clean --target-dir target/source-consumer --profile dev
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.rust }}
          path: |
            target/compat-*-evidence/**
            target/source-consumer-evidence/**
            target/dist/*
          if-no-files-found: warn
          retention-days: 7

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Check audit storage before compilation
        run: python3 -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Build pinned audit tool
        run: cargo +stable install cargo-audit --locked --version 0.23.0 --root target/audit-tools --target-dir target/audit-build
      - name: Check audit storage after compilation
        if: always()
        run: python3 -c "from tools.check_compat import guard, ROOT; guard(ROOT)"
      - name: Audit project lockfile
        run: target/audit-tools/bin/cargo-audit audit
      - name: Clean completed audit build
        if: always() && steps.rust.outcome == 'success'
        run: cargo +stable clean --target-dir target/audit-build --profile release
