[package]
name = "telegram-http-benchmark"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "multipart", "tokio"] }
frankenstein = { version = "=0.53.0", features = ["client-reqwest"] }
reqwest-012 = { package = "reqwest", version = "0.12", default-features = false }
serde_json = "1"
teloxide = { version = "=0.17.0", default-features = false }
tempfile = "3"
tg = { path = "../..", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
